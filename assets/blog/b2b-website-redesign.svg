<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1a1a"/>
      <stop offset="1" stop-color="#0e0e0e"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.75" cy="0.25" r="0.6">
      <stop offset="0" stop-color="#10b981" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity="0.04"/>
    </pattern>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <rect width="800" height="500" fill="url(#dots)"/>
  <rect width="800" height="500" fill="url(#glow)"/>
  <g font-family="Inter, system-ui, sans-serif" fill="#ffffff">
    <text x="56" y="80" font-size="14" font-weight="500" letter-spacing="3" fill-opacity="0.45">STRATEGY</text>
    <text x="56" y="280" font-size="120" font-weight="700" letter-spacing="-4">STRAT</text>
    <text x="56" y="440" font-size="20" font-weight="500" fill-opacity="0.7">Designit Studio</text>
  </g>
  <line x1="56" y1="100" x2="120" y2="100" stroke="#10b981" stroke-width="2"/>
</svg>