<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1b1b"/>
      <stop offset="1" stop-color="#0a0a0a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.8" cy="0.2" r="0.7">
      <stop offset="0" stop-color="#8e5cff" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#8e5cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="title-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#999999"/>
    </linearGradient>
    <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity="0.04"/>
    </pattern>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <rect width="800" height="500" fill="url(#dots)"/>
  <rect width="800" height="500" fill="url(#glow)"/>
  <!-- Category label -->
  <text x="56" y="80" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="500" letter-spacing="3" fill="#ffffff" fill-opacity="0.45">UX AUDIT</text>
  <!-- Accent line -->
  <line x1="56" y1="100" x2="120" y2="100" stroke="#8e5cff" stroke-width="2"/>
  <!-- Blog title - line 1 -->
  <text x="56" y="290" font-family="Inter, system-ui, sans-serif" font-size="68" font-weight="700" letter-spacing="-2" fill="url(#title-grad)">UI/UX Audit</text>
  <!-- Blog title - line 2 -->
  <text x="56" y="368" font-family="Inter, system-ui, sans-serif" font-size="68" font-weight="700" letter-spacing="-2" fill="url(#title-grad)" fill-opacity="0.75">for Your Website</text>
  <!-- Branding -->
  <text x="56" y="460" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="500" fill="#ffffff" fill-opacity="0.35">Designit Studio</text>
  <circle cx="190" cy="454" r="3" fill="#8e5cff" fill-opacity="0.6"/>
  <text x="202" y="460" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="500" fill="#ffffff" fill-opacity="0.35">designit.co.in</text>
</svg>