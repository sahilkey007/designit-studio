    <text x="56" y="80" font-size="13" letter-spacing="3" fill-opacity="0.45">SERVICE</text>
    <text x="56" y="340" font-size="44" font-weight="700" letter-spacing="-1">UX Research & Discovery</text>
  </g>
  <line x1="56" y1="100" x2="120" y2="100" stroke="#a855f7" stroke-width="2"/>
