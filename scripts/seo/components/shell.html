        .geo-hero {
            padding: 160px 0 80px;
            text-align: center;
        }
        .geo-hero h1 {
            font-size: clamp(40px, 6vw, 72px);
            font-weight: 800;
            letter-spacing: -3px;
            line-height: 1.08;
            margin: 16px 0 24px;
        }
        .geo-hero .subtitle {
            font-size: 20px;
            color: var(--text-tertiary);
            line-height: 1.7;
            max-width: 700px;
            margin: 0 auto 40px;
        }
        .geo-hero .hero-ctas {
            display: flex;
            gap: 16px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .geo-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 24px;
            margin-top: 72px;
            padding-top: 72px;
            border-top: 1px solid var(--border-subtle);
        }
        .geo-stat {
            text-align: center;
        }
        .geo-stat-num {
            font-size: 48px;
            font-weight: 800;
            letter-spacing: -2px;
            background: linear-gradient(135deg, #fff 0%, #999 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .geo-stat-label {
            font-size: 15px;
            color: var(--text-tertiary);
            margin-top: 4px;
        }
        .why-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 24px;
            margin-top: 56px;
        }
        .project-cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 24px;
            margin-top: 56px;
        }
        .faq-list {
            margin-top: 56px;
            max-width: 800px;
            margin-left: auto;
            margin-right: auto;
        }
        .geo-cta-section {
            text-align: center;
            padding: 120px 0;
        }
        .geo-cta-section h2 {
            font-size: clamp(36px, 5vw, 60px);
            font-weight: 800;
            letter-spacing: -2px;
            margin-bottom: 20px;
        }
        .geo-cta-section p {
            font-size: 18px;
            color: var(--text-tertiary);
            margin-bottom: 40px;
        }
        /* ── Agenciy design-system components (added) ───────────── */
        .section-tag {
            display: inline-block;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-tertiary);
            margin-bottom: 16px;
        }
        .section-title { text-align: center; }
        .svc-full-card h3, .svc-full-card p, .project-card-body { text-align: left; }
        .faq-q, .faq-a { text-align: left; }
        .tag {
            display: inline-flex;
            align-items: center;
            padding: 6px 14px;
            font-size: 14px;
            font-weight: 500;
            border-radius: var(--radius-full);
            background: var(--bg-overlay-subtle);
            color: var(--text-secondary);
            border: 1px solid var(--border-subtle);
        }
        .geo-stats { grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); }
        .why-grid .svc-full-card {
            background: var(--bg-card);
            border: 1px solid var(--border-default);
            border-radius: var(--radius-md);
            padding: 32px;
            transition: border-color .3s, transform .2s, box-shadow .3s;
        }
        .why-grid .svc-full-card:hover {
            border-color: var(--border-medium);
            transform: translateY(-3px);
            box-shadow: var(--shadow-card-inset);
        }
        .svc-icon {
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: var(--radius-sm);
            background: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            color: #fff;
            margin-bottom: 20px;
        }
        .svc-icon svg { width: 24px; height: 24px; }
        .why-grid .svc-full-card h3 {
            font-size: 22px;
            font-weight: 600;
            color: #fff;
            line-height: 1.3;
            letter-spacing: -0.3px;
            margin-bottom: 12px;
        }
        .why-grid .svc-full-card p {
            font-size: 16px;
            color: var(--text-tertiary);
            line-height: 1.6;
        }
        .chip {
            display: inline-block;
            font-size: 12px;
            font-weight: 500;
            color: var(--text-secondary);
            background: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-xs);
            padding: 5px 12px;
            letter-spacing: .3px;
        }
        .faq-list .faq-item {
            border: none;
            border-bottom: 1px solid var(--border-subtle);
            border-radius: 0;
            margin: 0;
        }
        .faq-list .faq-q {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            background: transparent;
            border: none;
            text-align: left;
            font-family: inherit;
            font-size: 18px;
            font-weight: 600;
            color: #fff;
            padding: 24px 0;
            cursor: pointer;
        }
        .faq-list .faq-chevron {
            font-size: 16px;
            color: var(--text-tertiary);
            transition: transform .3s;
            flex-shrink: 0;
        }
        .faq-list .faq-item.open .faq-chevron { transform: rotate(180deg); }
        .faq-list .faq-a {
            max-height: 0;
            overflow: hidden;
            transition: max-height .35s ease, padding .35s ease;
        }
        .faq-list .faq-item.open .faq-a { max-height: 600px; padding-bottom: 24px; }
        .faq-list .faq-a p {
            margin: 0;
            font-size: 16px;
            color: var(--text-tertiary);
            line-height: 1.7;
        }
        .project-cards-grid .project-card-body { display: flex; flex-direction: column; align-items: flex-start; }
        .project-cards-grid .project-card-body p { margin-bottom: 22px; }
        .project-cards-grid .project-card-meta { margin-bottom: 14px; }
