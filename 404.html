<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — Page Not Found | Designit</title>
    <meta name="description" content="The page you're looking for doesn't exist or has been moved.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/design-system.css">
    <link rel="stylesheet" href="/pages.css">
    <link rel="stylesheet" href="/intake-form.css">
    <link rel="icon" type="image/svg+xml" href="/logo.svg">
    <style>
        .error-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 120px 24px 80px;
        }
        .error-page-content {
            max-width: 560px;
        }
        .error-code {
            font-size: clamp(120px, 20vw, 200px);
            font-weight: 900;
            letter-spacing: -6px;
            line-height: 1;
            margin-bottom: 16px;
        }
        .error-page h2 {
            font-size: 32px;
            font-weight: 700;
            letter-spacing: -1px;
            color: var(--text-primary);
            margin-bottom: 12px;
        }
        .error-page p {
            font-size: 17px;
            color: var(--text-tertiary, #888);
            line-height: 1.7;
            margin-bottom: 36px;
        }
        .error-page .error-actions {
            display: flex;
            gap: 16px;
            justify-content: center;
            flex-wrap: wrap;
        }
    </style>
</head>
<body>

    <!-- Navbar -->
    <header class="navbar" id="navbar">
        <a href="/" class="logo"><img src="/logo.svg" alt="Designit" height="28"></a>
        <nav class="nav-links" id="navLinks">
            <a href="/">Home</a>
            <a href="/about.html">About</a>
            <a href="/projects.html">Projects</a>
            <a href="/pricing.html">Pricing</a>
            <a href="/blog/index.html">Blog</a>
            <a href="/contact.html">Contact</a>
        </nav>
        <a href="#" onclick="openIntakeForm(); return false;" class="btn btn-primary btn-sm nav-cta">Let's Chat!</a>
        <button class="mobile-toggle" id="mobileToggle" aria-label="Toggle menu">
            <span></span><span></span><span></span>
        </button>
    </header>

    <main>
        <section class="error-page">
            <div class="error-page-content">
                <div class="error-code gradient-text">404</div>
                <h2>Page Not Found</h2>
                <p>The page you're looking for doesn't exist or has been moved.</p>
                <div class="error-actions">
                    <a href="/" class="btn btn-primary">Go Home</a>
                    <a href="/contact.html" class="btn btn-outline">Contact Us</a>
                </div>
            </div>
        </section>
    </main>

    <script src="/main.js"></script>
    <script src="/intake-form.js"></script>
</body>
</html>
